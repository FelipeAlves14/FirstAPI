name: Python CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Python ${{ matrix.python }}
    strategy:
      matrix:
        python: ["3.11"]
    steps:
      - uses: actions/checkout@v4.2.1

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install
        run: pip install -r requirements.txt

      - name: Lint
        run: |
          pip install ruff
          ruff check .
      
      - name: Setup node.js
        uses: actions/setup-node@v3.7.0
        with:
          node-version: '18'

      - name: instalar jscpd
        run: npm install -g jscpd

      - name: Detectar código duplicado (jscpd)
        run: |
          jscpd . \
            --pattern "**/*.py" \
            --min-lines 10 \
            --min-tokens 50 \
            --threshold 0

      - name: Detectar código depreciado (flake8-deprecated)
        run: |
          pip install flake8 flake8-deprecated
          flake8 .
          ! grep -rn "sqlalchemy.ext.declarative" . --include="*.py" --exclude-dir=venv --exclude-dir=lib --exclude-dir=site-packages || (echo "ERRO: Uso de código depreciado detectado! Use 'sqlalchemy.orm' em vez de 'sqlalchemy.ext.declarative'" && exit 1)